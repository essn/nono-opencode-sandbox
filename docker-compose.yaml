services:
  agent:
    build: .
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      - ${PROJECT_DIR:-./project}:/workspace
      - nono-state:/home/agent/.local/state/nono
      # OpenCode sessions/data persist across runs.
      - opencode-data:/home/agent/.local/share/opencode
    secrets:
      - openrouter_key # appears at /run/secrets/openrouter_key, NOT in the env
    command:
      - nono
      - run
      - --rollback
      - --profile
      - opencode-sandbox
      - --credential
      - openrouter
      - --
      - opencode

secrets:
  openrouter_key:
    environment: OPENROUTER_API_KEY # read from the shell that runs `docker compose`

volumes:
  nono-state:
  opencode-data:
